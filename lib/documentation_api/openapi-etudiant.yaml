openapi: 3.0.3
info:
  title: STAGIA - API mobile étudiant
  version: 1.0.0
  description: |
    Contrat OpenAPI de la partie étudiant, établi à partir du code PHP actuel.

    Toutes les réponses JSON utilisent l'enveloppe `{ success, message, data }`.
    Sauf la connexion, les routes exigent `Authorization: Bearer <token>`.
    Le token créé par la connexion expire après 30 jours.

    État connu : `profile.php`, `refresh.php` et `logout.php` sont présents mais cassés
    à cause de fichiers inclus absents. Le refresh utilise en plus un modèle de session
    incompatible avec celui de la connexion. `documents.php` construit une URL vers
    `certificate-file.php`, qui n'existe pas encore. Ces limites sont signalées sur les opérations.

    Les dates/heures proviennent de MySQL : `YYYY-MM-DD` et `YYYY-MM-DD HH:mm:ss`,
    sans information de fuseau horaire.
servers:
  - url: http://localhost/stagia/api/v1
    description: Développement local WAMP
  - url: /api/v1
    description: URL relative à l'hôte courant
tags:
  - { name: Authentification }
  - { name: Compte }
  - { name: Profil et parcours }
  - { name: Tableau de bord }
  - { name: Candidatures et réservations }
  - { name: Paiements }
  - { name: Stages }
  - { name: Présences }
  - { name: Journal de stage }
  - { name: Évaluations }
  - { name: Documents }
security:
  - bearerAuth: []
paths:
  /auth/login.php:
    post:
      tags: [Authentification]
      summary: Connecter un utilisateur
      description: Connexion par identifiant utilisateur, e-mail ou code STAGIA.
      operationId: login
      security: []
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { identifiant: STG-ETU-00000030, password: mot-de-passe, device_name: Stagia Mobile }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Connexion réussie., content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/stage-options.php:
    get:
      tags: [Candidatures et réservations]
      summary: Lister les campagnes D4 et les hôpitaux disponibles
      description: Exclut les campagnes déjà engagées ou terminées par l'étudiant.
      operationId: listStageOptions
      x-implementation-status: implemented
      responses:
        '200': { description: 'Campagnes éligibles, capacités et frais.', content: { application/json: { schema: { $ref: '#/components/schemas/StageOptionsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/reserve.php:
    post:
      tags: [Candidatures et réservations]
      summary: Créer une candidature et réserver une place
      description: Réservation temporaire de 30 minutes. Idempotent si la même réservation active existe déjà.
      operationId: reserveStagePlace
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveRequest' }
            example: { campaign_id: 17, academic_enrollment_id: 33, participation_id: 11, motivation: Je souhaite développer mes compétences cliniques. }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/ReserveRequest' }
      responses:
        '200': { description: Réservation active existante renvoyée., content: { application/json: { schema: { $ref: '#/components/schemas/ReserveResponse' } } } }
        '201': { description: Nouvelle réservation créée., content: { application/json: { schema: { $ref: '#/components/schemas/ReserveResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /student/applications.php:
    get:
      tags: [Candidatures et réservations]
      summary: Lister les candidatures
      operationId: listApplications
      x-implementation-status: implemented
      responses:
        '200': { description: Candidatures et état global., content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/reservations.php:
    get:
      tags: [Candidatures et réservations]
      summary: Lister les réservations
      operationId: listReservations
      x-implementation-status: implemented
      responses:
        '200': { description: 'Réservations, expiration, frais et état global.', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/admission.php:
    get:
      tags: [Candidatures et réservations]
      summary: Suivre admission et affectation
      operationId: getAdmissionTracking
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/OptionalReservationUuid' }]
      responses:
        '200': { description: 'Chaîne réservation, admission, affectation et clôture.', content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/payment-checkout.php:
    post:
      tags: [Paiements]
      summary: Préparer confirmation ou facture
      description: Confirme une réservation gratuite; sinon crée/retourne la facture. N'appelle aucun opérateur de paiement.
      operationId: checkoutReservation
      x-implementation-status: implemented
      requestBody: { $ref: '#/components/requestBodies/ReservationUuidBody' }
      responses:
        '200': { description: Réservation confirmée ou facture prête., content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /student/payment-sync.php:
    post:
      tags: [Paiements]
      summary: Synchroniser paiement, réservation et admission
      description: Agrège les paiements validés déjà en base; peut confirmer la réservation et créer l'admission `ATTENDU`.
      operationId: syncReservationPayment
      x-implementation-status: implemented
      requestBody: { $ref: '#/components/requestBodies/ReservationUuidBody' }
      responses:
        '200': { description: 'État gratuit, payé, partiel ou en attente.', content: { application/json: { schema: { $ref: '#/components/schemas/PaymentSyncResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { description: Expiration ou synchronisation impossible., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/ErrorResponse' }, { $ref: '#/components/schemas/ExpiredReservationResponse' }] } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /student/payments.php:
    get:
      tags: [Paiements]
      summary: Lister les factures et paiements
      operationId: listPayments
      x-implementation-status: implemented
      responses:
        '200': { description: 'Factures, paiements associés et agrégats.', content: { application/json: { schema: { $ref: '#/components/schemas/PaymentsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/stages.php:
    get:
      tags: [Stages]
      summary: Lister les stages affectés
      operationId: listStages
      x-implementation-status: implemented
      responses:
        '200': { description: 'Stages planifiés, actifs, terminés et validés.', content: { application/json: { schema: { $ref: '#/components/schemas/StagesResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /auth/refresh.php:
    post:
      tags: [Authentification]
      summary: Renouveler les tokens (non opérationnel)
      description: Le fichier _bootstrap.php est absent; login.php ne fournit pas de refresh token et utilise une autre table.
      operationId: refreshToken
      security: []
      deprecated: true
      x-implementation-status: broken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties: { refresh_token: { type: string, minLength: 1 } }
      responses:
        '200': { description: Contrat prévu après correction., content: { application/json: { schema: { $ref: '#/components/schemas/RefreshResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout.php:
    post:
      tags: [Authentification]
      summary: Révoquer la session (non opérationnel)
      description: Dépend du fichier absent `_bootstrap.php` et du modèle `api_mobile_sessions`.
      operationId: logout
      deprecated: true
      x-implementation-status: broken
      responses:
        '200': { $ref: '#/components/responses/EmptyOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me.php:
    get:
      tags: [Compte]
      summary: Obtenir l'utilisateur connecté
      operationId: getMe
      x-implementation-status: implemented
      responses:
        '200': { description: Utilisateur et profil étudiant éventuel., content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/dashboard.php:
    get:
      tags: [Tableau de bord]
      summary: Charger le tableau de bord étudiant
      operationId: getStudentDashboard
      x-implementation-status: implemented
      responses:
        '200': { description: 'Identité, compteurs et stage courant ou précédent.', content: { application/json: { schema: { $ref: '#/components/schemas/DashboardResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/profile.php:
    get:
      tags: [Profil et parcours]
      summary: Obtenir le profil actif (non opérationnel)
      description: L'inclusion `api/includes/auth.php` cible actuellement un fichier absent.
      operationId: getStudentProfile
      deprecated: true
      x-implementation-status: broken
      responses:
        '200': { description: Profil et rattachement actif., content: { application/json: { schema: { $ref: '#/components/schemas/ProfileResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/enrollments.php:
    get:
      tags: [Profil et parcours]
      summary: Lister les rattachements universitaires
      operationId: listStudentEnrollments
      x-implementation-status: implemented
      responses:
        '200': { description: Rattachements de l'étudiant., content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/academic-path.php:
    get:
      tags: [Profil et parcours]
      summary: Obtenir le parcours d'un rattachement
      operationId: getAcademicPath
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/EnrollmentId' }]
      responses:
        '200': { description: Rattachement et historique académique., content: { application/json: { schema: { $ref: '#/components/schemas/AcademicPathResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/attendance.php:
    get:
      tags: [Présences]
      summary: Lister les présences
      operationId: listAttendance
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/OptionalAssignmentUuid' }]
      responses:
        '200': { description: Présences et statistiques., content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/logbook.php:
    get:
      tags: [Journal de stage]
      summary: Lister les entrées du journal
      operationId: listLogbookEntries
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/OptionalAssignmentUuid' }]
      responses:
        '200': { description: 'Journaux, activités, droits et statistiques.', content: { application/json: { schema: { $ref: '#/components/schemas/LogbookResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/logbook-save.php:
    post:
      tags: [Journal de stage]
      summary: Créer ou modifier un brouillon
      description: Stage `ACTIVE`, date dans la période; remplace toutes les activités. Modifiable en `BROUILLON`, `REJETE` ou `REJETEE`.
      operationId: saveLogbookEntry
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogbookSaveRequest' }
            example:
              assignment_uuid: 6c049f97-408e-4fc2-bd59-11848000a714
              date: '2026-09-18'
              summary: Consultation et suivi des patients.
              learning: Prise des constantes.
              difficulties: Aucune.
              activities: [{ activity: Prise des constantes, category: SOINS, involvement_level: REALISE, quantity: 4, observation: Sous supervision. }]
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/LogbookSaveRequest' }
      responses:
        '200': { description: Brouillon enregistré., content: { application/json: { schema: { $ref: '#/components/schemas/LogbookSaveResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /student/logbook-submit.php:
    post:
      tags: [Journal de stage]
      summary: Soumettre un journal pour validation
      description: Idempotent si déjà soumis/validé. Au moins une activité est obligatoire.
      operationId: submitLogbookEntry
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UuidRequest' } }
          application/x-www-form-urlencoded: { schema: { $ref: '#/components/schemas/UuidRequest' } }
      responses:
        '200': { description: 'Journal soumis, déjà soumis ou déjà validé.', content: { application/json: { schema: { $ref: '#/components/schemas/LogbookSubmitResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /student/evaluations.php:
    get:
      tags: [Évaluations]
      summary: Lister les évaluations validées
      description: Le code ne retient que le statut SQL exact `VALIDEE`.
      operationId: listEvaluations
      x-implementation-status: implemented
      parameters: [{ $ref: '#/components/parameters/OptionalAssignmentUuid' }]
      responses:
        '200': { description: 'Évaluations, moyenne et dernière évaluation finale.', content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }
  /student/documents.php:
    get:
      tags: [Documents]
      summary: Lister attestations et certificats
      description: Le champ pdf_endpoint cible un fichier absent; verification_url pointe vers la page Web publique.
      operationId: listOfficialDocuments
      x-implementation-status: implemented-with-missing-download
      responses:
        '200': { description: Documents officiels et liens., content: { application/json: { schema: { $ref: '#/components/schemas/DocumentsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-64-hex
      description: Token opaque de 64 caractères hexadécimaux produit par `/auth/login.php`.
  parameters:
    EnrollmentId:
      name: enrollment_id
      in: query
      required: true
      description: Identifiant d'un rattachement appartenant à l'étudiant.
      schema: { type: integer, format: int64, minimum: 1 }
    OptionalAssignmentUuid:
      name: assignment_uuid
      in: query
      required: false
      description: Filtre par UUID du stage; sans valeur, toutes les données sont renvoyées.
      schema: { type: string, format: uuid }
    OptionalReservationUuid:
      name: reservation_uuid
      in: query
      required: false
      description: Filtre par UUID de réservation.
      schema: { type: string, format: uuid }
  requestBodies:
    ReservationUuidBody:
      required: true
      content:
        application/json: { schema: { $ref: '#/components/schemas/ReservationUuidRequest' } }
        application/x-www-form-urlencoded: { schema: { $ref: '#/components/schemas/ReservationUuidRequest' } }
  responses:
    EmptyOk: { description: Opération réussie., content: { application/json: { schema: { $ref: '#/components/schemas/EmptySuccessResponse' } } } }
    Unauthorized: { description: Token absent/invalide/expiré ou identifiants invalides., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, message: Authentification requise., data: [] } } } }
    Forbidden: { description: Compte ou rôle non autorisé., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    StudentNotFound: { description: Profil étudiant introuvable., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Ressource introuvable., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    MethodNotAllowed: { description: Méthode HTTP non autorisée., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ValidationError: { description: Payload ou paramètre invalide., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: 'Conflit métier de capacité, état, expiration ou propriété.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ServerError: { description: Erreur serveur ou incompatibilité de schéma SQL., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    EmptyData: { type: array, maxItems: 0, items: {}, example: [] }
    ErrorResponse:
      type: object
      required: [success, message, data]
      properties: { success: { type: boolean, enum: [false] }, message: { type: string }, data: { $ref: '#/components/schemas/EmptyData' } }
    EmptySuccessResponse:
      type: object
      required: [success, message, data]
      properties: { success: { type: boolean, enum: [true] }, message: { type: string }, data: { $ref: '#/components/schemas/EmptyData' } }
    NullableString: { type: string, nullable: true }
    NullableDate: { type: string, format: date, nullable: true }
    NullableDateTime: { type: string, pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$', nullable: true }
    NullableNumber: { type: number, format: float, nullable: true }
    Uuid: { type: string, format: uuid }
    NullableUuid: { type: string, format: uuid, nullable: true }
    CodeName:
      type: object
      required: [code, name]
      properties: { code: { $ref: '#/components/schemas/NullableString' }, name: { $ref: '#/components/schemas/NullableString' } }
    CampaignSummary:
      type: object
      required: [code, title]
      properties: { code: { $ref: '#/components/schemas/NullableString' }, title: { $ref: '#/components/schemas/NullableString' }, start_date: { $ref: '#/components/schemas/NullableDate' }, end_date: { $ref: '#/components/schemas/NullableDate' } }
    AssignmentSummary:
      type: object
      required: [uuid, status, start_date, end_date]
      properties:
        uuid: { $ref: '#/components/schemas/NullableUuid' }
        status: { type: string, nullable: true }
        start_date: { $ref: '#/components/schemas/NullableDate' }
